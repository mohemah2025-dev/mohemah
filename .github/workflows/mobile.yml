# Builds the two Flutter apps (مهمة / مهمة شريك) and publishes test APKs.
#
# Before the first run: Settings → Secrets and variables → Actions → Variables →
#   New repository variable  API_BASE = https://app.<your-account>.workers.dev
#
# Output: a release named "mobile-test" with mohemah-customer.apk and mohemah-partner.apk,
# installable directly on Android phones. iOS is compiled (unsigned) only when requested.
name: Mobile apps

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      ios:
        description: "Also compile the iOS apps (unsigned check, uses macOS minutes)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android • ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [customer, provider]
    env:
      API_BASE: ${{ vars.API_BASE }}
      GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check API_BASE
        run: |
          if [ -z "$API_BASE" ]; then
            echo "::error::Set the repository variable API_BASE (Settings → Secrets and variables → Actions → Variables) to your Worker URL, e.g. https://app.<account>.workers.dev"
            exit 1
          fi
          echo "API_BASE=$API_BASE"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        working-directory: mobile/apps/${{ matrix.app }}
        run: |
          flutter --version
          if [ ! -d android ]; then
            flutter create --platforms=android,ios --org sa.mohemah --project-name mohemah_${{ matrix.app }} .
            rm -rf test
          fi
          python3 ../../tool/configure_platforms.py . ${{ matrix.app }}

      - name: Dependencies, icon and launch screen
        working-directory: mobile/apps/${{ matrix.app }}
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analyze (report only; the build below is the gate)
        continue-on-error: true
        run: |
          (cd mobile/packages/mohemah_core && flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings)
          (cd mobile/apps/${{ matrix.app }} && flutter analyze --no-fatal-infos --no-fatal-warnings lib)

      - name: Build APK
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter build apk --release --dart-define=API_BASE="$API_BASE" --dart-define=GOOGLE_MAPS_KEY="$GOOGLE_MAPS_API_KEY" $(python3 ../../tool/firebase_defines.py ${{ matrix.app }} android) --build-number=${{ github.run_number }}

      - name: Rename
        run: |
          name=${{ matrix.app == 'customer' && 'mohemah-customer' || 'mohemah-partner' }}
          mkdir -p out
          cp mobile/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk out/$name.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: out/*.apk
          retention-days: 30

  publish:
    name: Publish test APKs
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-test
          name: "نسخ تجريبية — مهمة ومهمة شريك"
          prerelease: true
          make_latest: false
          body: |
            نسخ تجريبية لأجهزة أندرويد (رقم البناء ${{ github.run_number }}).
            - mohemah-customer.apk — تطبيق «مهمة» لطالب الخدمة
            - mohemah-partner.apk — تطبيق «مهمة شريك» لمقدم الخدمة
            حمّل الملف على الجوال واسمح بالتثبيت من مصادر غير معروفة عند الطلب.
          files: out/*.apk

  web:
    name: Web • ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            path: app
          - app: provider
            path: partner
    env:
      API_BASE: ${{ vars.API_BASE }}
      GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build web version
        working-directory: mobile/apps/${{ matrix.app }}
        run: |
          flutter create --platforms=web --org sa.mohemah --project-name mohemah_${{ matrix.app }} .
          rm -rf test
          python3 ../../tool/configure_platforms.py . ${{ matrix.app }}
          flutter pub get
          flutter build web --release --base-href /${{ matrix.path }}/ \
            --dart-define=API_BASE="$API_BASE" --dart-define=GOOGLE_MAPS_KEY="$GOOGLE_MAPS_API_KEY"
          mkdir -p ../../../out-web/${{ matrix.path }}
          cp -r build/web/. ../../../out-web/${{ matrix.path }}/
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.path }}
          path: out-web
          retention-days: 7

  publish-web:
    name: Publish web versions (/app and /partner)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: web-*
          merge-multiple: true
          path: out-web
      - name: Commit into public/ (Cloudflare deploys it with the site)
        run: |
          rm -rf public/app public/partner
          cp -r out-web/app public/app
          cp -r out-web/partner public/partner
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app public/partner
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update web versions of the mobile apps (build ${{ github.run_number }})"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

  ios:
    name: iOS (unsigned check)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [customer, provider]
    env:
      API_BASE: ${{ vars.API_BASE }}
      GOOGLE_MAPS_API_KEY: ${{ vars.GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        working-directory: mobile/apps/${{ matrix.app }}
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=android,ios --org sa.mohemah --project-name mohemah_${{ matrix.app }} .
            rm -rf test
          fi
          python3 ../../tool/configure_platforms.py . ${{ matrix.app }}
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build (no code signing)
        working-directory: mobile/apps/${{ matrix.app }}
        run: flutter build ios --release --no-codesign --dart-define=API_BASE="$API_BASE" --dart-define=GOOGLE_MAPS_KEY="$GOOGLE_MAPS_API_KEY" $(python3 ../../tool/firebase_defines.py ${{ matrix.app }} ios)
