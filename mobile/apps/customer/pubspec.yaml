name: mohemah_customer
description: مهمة — تطبيق طالب الخدمة
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mohemah_core:
    path: ../../packages/mohemah_core

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

# App icon (generated in CI by `dart run flutter_launcher_icons`).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../../branding/icon-customer.png
  adaptive_icon_background: "#3A6CCE"
  adaptive_icon_foreground: ../../branding/icon-customer-foreground.png
  remove_alpha_ios: true

# Native launch screen shown before the animated opening (same color, so the hand-off is seamless).
flutter_native_splash:
  color: "#F5F7FB"
  android_12:
    color: "#F5F7FB"
