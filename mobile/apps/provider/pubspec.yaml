name: mohemah_provider
description: مهمة شريك — تطبيق مقدم الخدمة
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mohemah_core:
    path: ../../packages/mohemah_core
  image_picker: ^1.1.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: ../../branding/icon-provider.png
  adaptive_icon_background: "#1B2F6B"
  adaptive_icon_foreground: ../../branding/icon-provider-foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F5F7FB"
  android_12:
    color: "#F5F7FB"
